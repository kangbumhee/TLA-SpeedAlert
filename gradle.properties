org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 프로젝트 경로에 한글 등 비ASCII가 있을 때(예: 테슬라 CAN...) Windows 빌드 허용
android.overridePathCheck=true
#
# Mapbox public token(pk...)은 이 파일에 넣지 마세요(커밋·푸시 금지).
# 로컬: local.properties 에 MAPBOX_ACCESS_TOKEN=... 추가 (이미 .gitignore 됨)
# CI: GitHub Repository secrets → MAPBOX_ACCESS_TOKEN
#
# 경로 엔진: true=Mapbox Directions(+토큰), false=OSRM base URL 사용
# 토큰이 없으면 true여도 요청이 실패하므로, 공개 OSRM만 쓸 때는 false 권장.
USE_MAPBOX=false
# Mapbox 미사용 시 또는 RouteService OSRM 분기용 (끝 슬래시 없음).
# FOSSGIS 공개 OSRM — project-osrm.org 데모는 자주 불안정함.
OSRM_ROUTE_BASE_URL=https://routing.openstreetmap.de/routed-car/route/v1/driving
