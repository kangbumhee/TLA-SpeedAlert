org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 프로젝트 경로에 한글 등 비ASCII가 있을 때(예: 테슬라 CAN...) Windows 빌드 허용
android.overridePathCheck=true
#
# Mapbox public token(pk...)은 이 파일에 넣지 마세요(커밋·푸시 금지).
# 로컬: local.properties 에 MAPBOX_ACCESS_TOKEN=... 추가 (이미 .gitignore 됨)
# CI: GitHub Repository secrets → MAPBOX_ACCESS_TOKEN
#
# 경로 엔진: true=Mapbox Directions(+토큰), false=OSRM 자체 서버 base URL 사용
# OSRM 예: https://route.example.com/route/v1/driving (끝에 슬래시 없이)
USE_MAPBOX=true
OSRM_ROUTE_BASE_URL=
